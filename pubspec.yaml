name: proxitip_system_bars
description: "Android plugin: dark navigation bar with light buttons on the host Activity window, including Android 15+ edge-to-edge windows."
repository: https://github.com/Donjuice31/proxitip_system_bars
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.proximitylabs.proxitip_system_bars
        pluginClass: ProxitipSystemBarsPlugin
