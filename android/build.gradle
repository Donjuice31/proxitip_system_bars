group 'com.proximitylabs.proxitip_system_bars'
version '0.1.0'

// Classic (AGP 8) plugin layout, matching the host ProxiTip/FlutterFlow build:
// AGP 8.11.1 + Kotlin 2.2.20 (generated_code/android/settings.gradle).
// The buildscript block is only used when this module is built on its own;
// inside an app the app's plugin versions win.
buildscript {
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.proximitylabs.proxitip_system_bars'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdk 24
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'skipped', 'failed'
            }
        }
    }

    lint {
        abortOnError true
        warningsAsErrors false
    }
}

dependencies {
    // No runtime dependencies beyond the Flutter embedding (provided by the
    // Flutter Gradle plugin) and the Android platform.
    testImplementation 'junit:junit:4.13.2'
}
